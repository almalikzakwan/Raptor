{% extends "layouts/app.html" %}

{% block title %} Raptor | Dashboard {% endblock %}

{% block content %}
<section style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #111; padding: 120px 20px;">
    <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 40px; width: 100%; max-width: 600px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); color: #fff; font-family: 'Montserrat', sans-serif;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 80px; height: 80px; background: rgba(57, 181, 74, 0.1); border: 2px solid #39b54a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fa fa-user" style="font-size: 40px; color: #39b54a;"></i>
            </div>
            <h2 style="color: #39b54a; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 1px;">Welcome!</h2>
            <p style="color: #888; font-size: 14px; margin-top: 5px;">Your session is currently protected by Middleware</p>
        </div>

        <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 25px; margin-bottom: 30px;">
            <h3 style="color: #fff; font-size: 16px; font-weight: 600; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">User Profile</h3>
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <span style="color: #aaa; font-size: 14px;">Name:</span>
                <strong style="color: #fff; font-size: 14px;">{{ user.name }}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <span style="color: #aaa; font-size: 14px;">Username:</span>
                <strong style="color: #fff; font-size: 14px;">{{ user.username }}</strong>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: #aaa; font-size: 14px;">Status:</span>
                <span style="background: rgba(57, 181, 74, 0.2); color: #39b54a; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; text-transform: uppercase;">Authenticated</span>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="{{ url_for('logout') }}" style="display: inline-block; padding: 12px 30px; background: transparent; border: 2px solid #ff0033; border-radius: 6px; color: #ff0033; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;">
                Logout
            </a>
        </div>
    </div>
</section>

<script>
    // Improved logout button hover effect.
    const logoutBtn = document.querySelector('a[href*="logout"]');
    if (logoutBtn) {
        logoutBtn.style.transition = 'all 0.3s ease';
        logoutBtn.addEventListener('mouseenter', () => {
            logoutBtn.style.backgroundColor = '#ff0033';
            logoutBtn.style.color = '#fff';
        });
        logoutBtn.addEventListener('mouseleave', () => {
            logoutBtn.style.backgroundColor = 'transparent';
            logoutBtn.style.color = '#ff0033';
        });
    }
</script>
{% endblock %}
